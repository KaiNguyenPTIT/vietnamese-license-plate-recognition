# =====================================================================
# CẤU HÌNH HỆ THỐNG NHẬN DẠNG BIỂN SỐ XE VIỆT NAM
# Mọi tham số thuật toán được tập trung tại đây để dễ thử nghiệm.
# Các giá trị là điểm khởi đầu, KHÔNG phải bộ tham số tối ưu cho mọi ảnh.
# =====================================================================

project:
  name: "Nhan dang bien so xe Viet Nam"
  seed: 42

paths:
  templates_dir: "data/templates"
  samples_dir: "data/samples"
  labels_file: "data/labels.csv"
  results_dir: "results"

image:
  max_side: 1600          # Cạnh dài tối đa khi xử lý (giữ hệ số scale)
  min_side: 40            # Ảnh nhỏ hơn ngưỡng này bị coi là không hợp lệ
  allowed_extensions: [".jpg", ".jpeg", ".png", ".webp"]

preprocessing:
  blur_method: "gaussian" # gaussian | median | bilateral | none
  gaussian_kernel: 5
  median_kernel: 5
  use_clahe: false
  clahe_clip_limit: 2.0
  clahe_tile_grid: [8, 8]
  canny_low: 60
  canny_high: 180
  auto_canny: false
  threshold_method: "otsu"   # otsu | adaptive
  adaptive_block_size: 11
  adaptive_c: 2

detection:
  close_kernel: [17, 3]
  # Thêm vài biến thể morphology để bắt biển 2 dòng / biển bị đứt nét
  extra_close_kernels:
    - [25, 5]
    - [15, 7]
  min_area_ratio: 0.0008
  # Biển chụp cận cảnh có thể chiếm gần như toàn bộ ảnh.
  max_area_ratio: 0.95
  # Biển 1 dòng ~4.7, biển 2 dòng ~1.4. Dải lọc rộng để hỗ trợ cả hai.
  min_ratio: 1.10
  max_ratio: 7.0
  ratio_targets: [4.6, 1.45]
  ratio_tolerance: 0.75
  ideal_area_ratio: 0.05
  area_sigma: 1.7
  edge_density_min: 0.02
  edge_density_ideal: 0.12
  edge_density_max: 0.40
  fill_ratio_min: 0.30
  weights:
    ratio: 0.35
    area: 0.15
    edge: 0.30
    fill: 0.15
  # Điểm "giống vùng chữ" là phần mở rộng có thể tắt bằng cách đặt 0.
  text_likeness_weight: 0.20
  require_text_evidence: true
  min_text_likeness: 0.15
  min_score: 0.45
  top_k: 5
  padding_ratio: 0.03
  merge_iou: 0.45
  max_candidates: 25
  # Ứng viên cụm chữ cắt sát ký tự nên OCR tốt nhưng IoU với biển thật thấp.
  # Khi ứng viên hình học bao trọn cụm chữ, dùng hộp hình học làm hộp báo
  # cáo; vùng cắt dùng cho OCR vẫn giữ nguyên.
  text_bbox_hint: true
  text_bbox_hint_min_containment: 0.80
  text_bbox_hint_max_area_ratio: 4.0
  text_bbox_hint_min_score: 0.50

rectification:
  # Vùng cắt cần rộng hơn bounding box ứng viên một chút để không cắt mất
  # viền biển khi biển bị nghiêng (bounding box của biển nghiêng thường sát
  # vào các góc chữ). 0.10 là giá trị đã kiểm tra trên tập dev tổng hợp.
  padding_ratio: 0.10
  # Padding dọc theo chiều rộng: biển nghiêng có thể vượt khỏi bounding box
  # theo trục y dù chiều cao bounding box nhỏ; pad thêm để không cắt góc biển.
  vertical_padding_ratio: 0.06
  approx_epsilon_ratio: 0.02
  min_quad_area_ratio: 0.45
  output_min_width: 60
  output_min_height: 20
  fallback_deskew: true
  deskew_min_angle: 2.5
  deskew_max_angle: 18.0
  max_output_ratio: 8.0

segmentation:
  plate_width: 640        # Chuẩn hóa chiều rộng vùng biển trước khi phân đoạn
  threshold_method: "auto"  # otsu | adaptive | auto (chọn theo độ hợp lý hình học)
  adaptive_block_size: 21
  adaptive_c: 5
  blur_kernel: 3
  use_clahe: true
  clahe_clip_limit: 2.0
  clahe_tile_grid: [8, 8]
  border_margin_ratio: 0.015
  close_kernel: [2, 2]
  min_char_height_ratio: 0.42
  max_char_height_ratio: 1.02
  min_char_width_ratio: 0.008
  max_char_width_ratio: 0.24
  min_char_area_ratio: 0.0003
  min_fill_ratio: 0.08
  row_min_height_ratio: 0.17
  row_gap_min_ratio: 0.012
  row_projection_threshold: 0.02
  # Fallback tách dòng bằng connected components khi projection gộp 2 dòng.
  component_row_fallback: true
  adaptive_block_max: 71
  split_wide: true
  split_valley_ratio: 0.30
  merge_gap_px: 2
  # Biển chuẩn 7-9 ký tự. Biển đặc biệt 10 ký tự chỉ được chấp nhận khi
  # hai dòng cân bằng (ví dụ 5/5), tránh mảnh nhiễu ở mép tạo chuỗi 4/6.
  expected_chars: [7, 9]
  allow_balanced_long_plate: true
  min_chars: 5
  char_padding: 2

recognition:
  # TM_CCOEFF_NORMED | TM_SQDIFF_NORMED | pixel | hybrid
  method: "TM_CCOEFF_NORMED"
  score_threshold: 0.60
  min_margin: 0.035
  # stretch: kéo giãn ink box về đúng canvas, giảm lệch độ dày nét.
  # aspect: giữ tỷ lệ như phiên bản cũ.
  normalize_mode: "stretch"
  normalized_width: 32
  normalized_height: 48
  padding: 2
  template_extensions: [".png", ".jpg", ".jpeg"]
  require_all_labels: false
  # Nếu template gốc nhỏ hơn kích thước chuẩn hóa, phóng to bằng nội suy
  upscale_templates: true
  # Nhãn không hợp lệ trên biển Việt Nam: không chấm điểm để tránh I/1, O/0.
  excluded_labels: ["I", "J", "O", "Q", "W"]
  # Làm mờ nhẹ trước khi tương quan: giảm lệch độ dày nét giữa các font.
  match_blur_sigma: 2.0
  shift_tolerance: 1
  # Ưu tiên topology: số lỗ bên trong ký tự giúp phân biệt 6/B, 0/8, D/B.
  # Chỉ trừ điểm ứng viên có số lỗ khác đa số template; không tạo ký tự mới.
  hole_prior: true
  hole_penalty: 0.20
  hole_min_area: 25.0
  # Bổ sung biến thể chữ 4 hở đỉnh (nét dọc phải bắt đầu từ giữa).
  # Đây là augmentation template thủ công, không học máy.
  open_top_four_variant: true
  # Bộ template đầy đủ chỉ loại ảnh gần trùng; nhận dạng hai tầng để tăng tốc.
  max_templates_per_label: 60
  template_min_diff_ratio: 0.005
  coarse_templates_per_label: 6
  coarse_top_labels: 6

postprocessing:
  # Quy tắc định dạng biển ô tô Việt Nam được cấu hình, không suy đoán ký tự.
  patterns:
    - "^[0-9]{2}[A-Z]{1,2}[0-9]{4,6}$"
  supported_description: "Biển Việt Nam: 2 số tỉnh + 1-2 chữ series + 4-6 số"
  # Tập chữ cái series hợp lệ theo quy định Việt Nam (không dùng I, J, O, Q, W)
  allowed_series_letters: "ABCDEFGHKLMNPSTUVXYZ"
  # Chọn lại trong danh sách template theo kiểu ký tự của từng vị trí.
  position_constraints: true
  position_resolve_max_drop: 0.15
  position_min_margin: 0.02
  min_mean_confidence: 0.60
  min_char_confidence: 0.50
  min_confident_ratio: 0.85

pipeline:
  max_candidates_to_try: 8
  save_debug: false
  debug_dir: "results/debug"
  fail_on_missing_templates: true

evaluation:
  iou_threshold: 0.5
  ipc_confidence_threshold: 0.55
  output_csv: "results/evaluation.csv"
  output_summary: "results/evaluation_summary.json"

ui:
  theme: "clam"
  max_display_width: 760
  max_display_height: 560
