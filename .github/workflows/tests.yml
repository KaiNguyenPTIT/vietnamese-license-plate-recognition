name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # Runner không có thư viện GUI của OpenCV, thay bằng bản headless.
          python -m pip install --force-reinstall --no-deps "opencv-python-headless>=4.8,<5"

      - name: Kiểm tra phiên bản
        run: |
          python --version
          python -c "import cv2, numpy, yaml; print('OpenCV', cv2.__version__); print('NumPy', numpy.__version__)"

      - name: Chạy kiểm thử
        run: python -m pytest -q
